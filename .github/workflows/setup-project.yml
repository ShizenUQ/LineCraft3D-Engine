name: 1-Click Setup & Build LineEngine3D

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate all Android project files
        run: |
          mkdir -p .github/workflows
          mkdir -p app/src/main/java/com/lineengine/studio

          cat << 'EOF' > .github/workflows/android-ci.yml
          name: Build LineEngine3D APK

          on:
            push:
              branches: [ main ]
            workflow_dispatch:

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout code
                  uses: actions/checkout@v4
                - name: Set up JDK 17
                  uses: actions/setup-java@v4
                  with:
                    java-version: '17'
                    distribution: 'temurin'
                - name: Setup Gradle 8.10
                  uses: gradle/actions/setup-gradle@v4
                  with:
                    gradle-version: "8.10"
                - name: Build Debug APK
                  run: gradle assembleDebug --no-daemon
                - name: Upload APK
                  uses: actions/upload-artifact@v4
                  with:
                    name: line-engine-debug-apk
                    path: app/build/outputs/apk/debug/app-debug.apk
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LineEngine3D"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.serialization") version "2.0.21" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("org.jetbrains.kotlin.plugin.serialization")
          }

          android {
              namespace = "com.lineengine.studio"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.lineengine.studio"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation(platform("androidx.compose:compose-bom:2024.10.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:glEsVersion="0x00030000" android:required="true" />

              <application
                  android:allowBackup="true"
                  android:label="LineEngine3D"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/lineengine/studio/ProjectModels.kt
          package com.lineengine.studio

          import android.content.Context
          import kotlinx.serialization.Serializable
          import kotlinx.serialization.encodeToString
          import kotlinx.serialization.json.Json
          import java.io.File
          import java.util.UUID

          @Serializable
          enum class LineTheme(
              val label: String,
              val bgR: Float, val bgG: Float, val bgB: Float,
              val lineR: Float, val lineG: Float, val lineB: Float
          ) {
              BLUEPRINT("Blueprint", 0.04f, 0.10f, 0.22f, 0.85f, 0.96f, 1.0f),
              NEON("Cyber Neon", 0.02f, 0.02f, 0.04f, 0.15f, 1.0f, 0.65f),
              SKETCH("Paper Sketch", 0.95f, 0.94f, 0.90f, 0.12f, 0.12f, 0.14f)
          }

          @Serializable
          data class LineEntityData(
              val id: String = UUID.randomUUID().toString(),
              val name: String = "Shape",
              val vertices: List<Float> = emptyList()
          )

          @Serializable
          data class SceneDocument(
              val entities: List<LineEntityData> = emptyList()
          )

          @Serializable
          data class ProjectMeta(
              val id: String = UUID.randomUUID().toString(),
              val name: String,
              val theme: LineTheme = LineTheme.BLUEPRINT,
              val createdAt: Long = System.currentTimeMillis()
          )

          class ProjectStorage(context: Context) {
              private val rootDir = File(context.filesDir, "projects").apply { mkdirs() }
              private val json = Json { prettyPrint = true; ignoreUnknownKeys = true }

              fun listProjects(): List<ProjectMeta> {
                  return rootDir.listFiles()
                      ?.filter { it.isDirectory }
                      ?.mapNotNull { dir ->
                          val metaFile = File(dir, "meta.json")
                          if (metaFile.exists()) {
                              runCatching { json.decodeFromString<ProjectMeta>(metaFile.readText()) }.getOrNull()
                          } else null
                      }
                      ?.sortedByDescending { it.createdAt }
                      ?: emptyList()
              }

              fun createProject(name: String, theme: LineTheme): ProjectMeta {
                  val meta = ProjectMeta(name = name.ifBlank { "Untitled World" }, theme = theme)
                  val dir = File(rootDir, meta.id).apply { mkdirs() }
                  File(dir, "meta.json").writeText(json.encodeToString(meta))
                  File(dir, "scene.json").writeText(json.encodeToString(SceneDocument()))
                  return meta
              }

              fun loadScene(projectId: String): SceneDocument {
                  val sceneFile = File(File(rootDir, projectId), "scene.json")
                  return if (sceneFile.exists()) {
                      runCatching { json.decodeFromString<SceneDocument>(sceneFile.readText()) }.getOrDefault(SceneDocument())
                  } else SceneDocument()
              }

              fun saveScene(projectId: String, scene: SceneDocument) {
                  val dir = File(rootDir, projectId).apply { mkdirs() }
                  File(dir, "scene.json").writeText(json.encodeToString(scene))
              }

              fun deleteProject(projectId: String) {
                  File(rootDir, projectId).deleteRecursively()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/lineengine/studio/LineViewport.kt
          package com.lineengine.studio

          import android.content.Context
          import android.opengl.GLES30
          import android.opengl.GLSurfaceView
          import android.opengl.Matrix
          import android.view.MotionEvent
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import java.nio.FloatBuffer
          import javax.microedition.khronos.egl.EGLConfig
          import javax.microedition.khronos.opengles.GL10
          import kotlin.math.cos
          import kotlin.math.hypot
          import kotlin.math.sin

          class LineViewportView(
              context: Context,
              theme: LineTheme,
              scene: SceneDocument
          ) : GLSurfaceView(context) {

              val renderer: LineWorldRenderer

              private var prevX1 = 0f
              private var prevY1 = 0f
              private var prevDist = 0f
              private var prevMidX = 0f
              private var prevMidY = 0f

              init {
                  setEGLContextClientVersion(3)
                  renderer = LineWorldRenderer(theme, scene)
                  setRenderer(renderer)
                  renderMode = RENDERMODE_CONTINUOUSLY
              }

              fun updateScene(newScene: SceneDocument) {
                  queueEvent { renderer.scene = newScene }
              }

              fun setShowOriginAxis(show: Boolean) {
                  queueEvent { renderer.showOriginAxis = show }
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  when (event.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          prevX1 = event.x
                          prevY1 = event.y
                      }
                      MotionEvent.ACTION_POINTER_DOWN -> {
                          if (event.pointerCount == 2) {
                              prevDist = hypot(event.getX(0) - event.getX(1), event.getY(0) - event.getY(1))
                              prevMidX = (event.getX(0) + event.getX(1)) * 0.5f
                              prevMidY = (event.getY(0) + event.getY(1)) * 0.5f
                          }
                      }
                      MotionEvent.ACTION_MOVE -> {
                          if (event.pointerCount == 1) {
                              val dx = event.x - prevX1
                              val dy = event.y - prevY1
                              renderer.orbit(dx * 0.35f, dy * 0.35f)
                              prevX1 = event.x
                              prevY1 = event.y
                          } else if (event.pointerCount >= 2) {
                              val dist = hypot(event.getX(0) - event.getX(1), event.getY(0) - event.getY(1))
                              val midX = (event.getX(0) + event.getX(1)) * 0.5f
                              val midY = (event.getY(0) + event.getY(1)) * 0.5f
                              if (prevDist > 1f) {
                                  renderer.zoom((prevDist - dist) * 0.02f)
                              }
                              renderer.pan((midX - prevMidX) * 0.01f, (midY - prevMidY) * 0.01f)
                              prevDist = dist
                              prevMidX = midX
                              prevMidY = midY
                          }
                      }
                  }
                  return true
              }
          }

          class LineWorldRenderer(
              private val theme: LineTheme,
              @Volatile var scene: SceneDocument
          ) : GLSurfaceView.Renderer {

              @Volatile var showOriginAxis: Boolean = true

              private var yaw = 45f
              private var pitch = 25f
              private var distance = 8f
              private var targetX = 0f
              private var targetY = 0f
              private var targetZ = 0f

              private val projMatrix = FloatArray(16)
              private val viewMatrix = FloatArray(16)
              private val vpMatrix = FloatArray(16)

              private var program = 0
              private var posHandle = 0
              private var mvpHandle = 0
              private var colorHandle = 0

              private val axisBuffer: FloatBuffer = floatArrayOf(
                  0f, 0f, 0f,  1.2f, 0f, 0f,
                  0f, 0f, 0f,  0f, 1.2f, 0f,
                  0f, 0f, 0f,  0f, 0f, 1.2f
              ).toFloatBuffer()

              fun orbit(dYaw: Float, dPitch: Float) {
                  yaw -= dYaw
                  pitch = (pitch + dPitch).coerceIn(-85f, 85f)
              }

              fun zoom(delta: Float) {
                  distance = (distance + delta).coerceIn(1.5f, 120f)
              }

              fun pan(dx: Float, dy: Float) {
                  val rad = Math.toRadians(yaw.toDouble()).toFloat()
                  val rightX = cos(rad)
                  val rightZ = -sin(rad)
                  targetX -= rightX * dx
                  targetZ -= rightZ * dx
                  targetY += dy
              }

              override fun onSurfaceCreated(gl: GL10?, config: EGLConfig?) {
                  GLES30.glClearColor(theme.bgR, theme.bgG, theme.bgB, 1f)
                  GLES30.glEnable(GLES30.GL_DEPTH_TEST)
                  GLES30.glLineWidth(4f)

                  val vs = """
                      #version 300 es
                      uniform mat4 uMVP;
                      layout(location = 0) in vec3 aPos;
                      void main() {
                          gl_Position = uMVP * vec4(aPos, 1.0);
                      }
                  """.trimIndent()

                  val fs = """
                      #version 300 es
                      precision mediump float;
                      uniform vec4 uColor;
                      out vec4 fragColor;
                      void main() {
                          fragColor = uColor;
                      }
                  """.trimIndent()

                  program = createProgram(vs, fs)
                  posHandle = 0
                  mvpHandle = GLES30.glGetUniformLocation(program, "uMVP")
                  colorHandle = GLES30.glGetUniformLocation(program, "uColor")
              }

              override fun onSurfaceChanged(gl: GL10?, width: Int, height: Int) {
                  GLES30.glViewport(0, 0, width, height)
                  val aspect = width.toFloat() / height.coerceAtLeast(1).toFloat()
                  Matrix.perspectiveM(projMatrix, 0, 55f, aspect, 0.1f, 300f)
              }

              override fun onDrawFrame(gl: GL10?) {
                  GLES30.glClear(GLES30.GL_COLOR_BUFFER_BIT or GLES30.GL_DEPTH_BUFFER_BIT)

                  val yawRad = Math.toRadians(yaw.toDouble())
                  val pitchRad = Math.toRadians(pitch.toDouble())
                  val camX = targetX + (distance * cos(pitchRad) * sin(yawRad)).toFloat()
                  val camY = targetY + (distance * sin(pitchRad)).toFloat()
                  val camZ = targetZ + (distance * cos(pitchRad) * cos(yawRad)).toFloat()

                  Matrix.setLookAtM(viewMatrix, 0, camX, camY, camZ, targetX, targetY, targetZ, 0f, 1f, 0f)
                  Matrix.multiplyMM(vpMatrix, 0, projMatrix, 0, viewMatrix, 0)

                  GLES30.glUseProgram(program)
                  GLES30.glUniformMatrix4fv(mvpHandle, 1, false, vpMatrix, 0)

                  if (showOriginAxis) {
                      drawLines(axisBuffer, 0, 2, 1f, 0.35f, 0.35f, 0.8f)
                      drawLines(axisBuffer, 2, 2, 0.35f, 1f, 0.45f, 0.8f)
                      drawLines(axisBuffer, 4, 2, 0.35f, 0.65f, 1f, 0.8f)
                  }

                  for (entity in scene.entities) {
                      if (entity.vertices.size >= 6) {
                          val buf = entity.vertices.toFloatArray().toFloatBuffer()
                          drawLines(buf, 0, entity.vertices.size / 3, theme.lineR, theme.lineG, theme.lineB, 1f)
                      }
                  }
              }

              private fun drawLines(buf: FloatBuffer, firstVertex: Int, vertexCount: Int, r: Float, g: Float, b: Float, a: Float) {
                  GLES30.glUniform4f(colorHandle, r, g, b, a)
                  GLES30.glEnableVertexAttribArray(posHandle)
                  GLES30.glVertexAttribPointer(posHandle, 3, GLES30.GL_FLOAT, false, 12, buf)
                  GLES30.glDrawArrays(GLES30.GL_LINES, firstVertex, vertexCount)
                  GLES30.glDisableVertexAttribArray(posHandle)
              }

              private fun createProgram(vsCode: String, fsCode: String): Int {
                  val vs = compileShader(GLES30.GL_VERTEX_SHADER, vsCode)
                  val fs = compileShader(GLES30.GL_FRAGMENT_SHADER, fsCode)
                  return GLES30.glCreateProgram().also {
                      GLES30.glAttachShader(it, vs)
                      GLES30.glAttachShader(it, fs)
                      GLES30.glLinkProgram(it)
                  }
              }

              private fun compileShader(type: Int, code: String): Int {
                  return GLES30.glCreateShader(type).also {
                      GLES30.glShaderSource(it, code)
                      GLES30.glCompileShader(it)
                  }
              }

              private fun FloatArray.toFloatBuffer(): FloatBuffer {
                  return ByteBuffer.allocateDirect(size * 4)
                      .order(ByteOrder.nativeOrder())
                      .asFloatBuffer()
                      .apply { put(this@toFloatBuffer); position(0) }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/lineengine/studio/MainActivity.kt
          package com.lineengine.studio

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.viewinterop.AndroidView

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme()) {
                          LineEngineApp()
                      }
                  }
              }
          }

          @Composable
          fun LineEngineApp() {
              val context = LocalContext.current
              val storage = remember { ProjectStorage(context) }
              var activeProject by remember { mutableStateOf<ProjectMeta?>(null) }

              Surface(modifier = Modifier.fillMaxSize(), color = Color(0xFF0E1117)) {
                  val project = activeProject
                  if (project == null) {
                      ProjectHubScreen(
                          storage = storage,
                          onOpenProject = { activeProject = it }
                      )
                  } else {
                      EditorPreviewScreen(
                          project = project,
                          storage = storage,
                          onBackToHub = { activeProject = null }
                      )
                  }
              }
          }

          @Composable
          fun ProjectHubScreen(
              storage: ProjectStorage,
              onOpenProject: (ProjectMeta) -> Unit
          ) {
              var projects by remember { mutableStateOf(storage.listProjects()) }
              var showCreateDialog by remember { mutableStateOf(false) }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(20.dp)
              ) {
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Column {
                          Text("LineEngine 3D", fontSize = 26.sp, fontWeight = FontWeight.Bold, color = Color.White)
                          Text("Draw shapes, logic & worlds in 3D lines", fontSize = 13.sp, color = Color(0xFF8B949E))
                      }
                      Button(onClick = { showCreateDialog = true }) {
                          Text("+ New Project")
                      }
                  }

                  Spacer(Modifier.height(20.dp))

                  if (projects.isEmpty()) {
                      Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                          Text(
                              "No projects yet. Tap '+ New Project' to start an empty 3D world.",
                              color = Color(0xFF8B949E)
                          )
                      }
                  } else {
                      LazyColumn(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                          items(projects, key = { it.id }) { proj ->
                              Card(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .clickable { onOpenProject(proj) },
                                  colors = CardDefaults.cardColors(containerColor = Color(0xFF161B22))
                              ) {
                                  Row(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .padding(16.dp),
                                      horizontalArrangement = Arrangement.SpaceBetween,
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Column {
                                          Text(proj.name, fontSize = 18.sp, fontWeight = FontWeight.SemiBold, color = Color.White)
                                          Text("Style: ${proj.theme.label}", fontSize = 12.sp, color = Color(0xFF58A6FF))
                                      }
                                      TextButton(onClick = {
                                          storage.deleteProject(proj.id)
                                          projects = storage.listProjects()
                                      }) {
                                          Text("Delete", color = Color(0xFFFF7B72))
                                      }
                                  }
                              }
                          }
                      }
                  }
              }

              if (showCreateDialog) {
                  var name by remember { mutableStateOf("") }
                  var selectedTheme by remember { mutableStateOf(LineTheme.BLUEPRINT) }

                  AlertDialog(
                      onDismissRequest = { showCreateDialog = false },
                      title = { Text("Create Line Project") },
                      text = {
                          Column(verticalArrangement = Arrangement.spacedBy(12.dp)) {
                              OutlinedTextField(
                                  value = name,
                                  onValueChange = { name = it },
                                  label = { Text("Project Name") },
                                  singleLine = true
                              )
                              Text("Line Theme:", fontSize = 13.sp, color = Color.LightGray)
                              LineTheme.entries.forEach { theme ->
                                  Row(
                                      verticalAlignment = Alignment.CenterVertically,
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .clickable { selectedTheme = theme }
                                          .padding(vertical = 4.dp)
                                  ) {
                                      RadioButton(selected = selectedTheme == theme, onClick = { selectedTheme = theme })
                                      Spacer(Modifier.width(8.dp))
                                      Text(theme.label)
                                  }
                              }
                          }
                      },
                      confirmButton = {
                          Button(onClick = {
                              val created = storage.createProject(name, selectedTheme)
                              projects = storage.listProjects()
                              showCreateDialog = false
                              onOpenProject(created)
                          }) {
                              Text("Create")
                          }
                      },
                      dismissButton = {
                          TextButton(onClick = { showCreateDialog = false }) { Text("Cancel") }
                      }
                  )
              }
          }

          @Composable
          fun EditorPreviewScreen(
              project: ProjectMeta,
              storage: ProjectStorage,
              onBackToHub: () -> Unit
          ) {
              var scene by remember(project.id) { mutableStateOf(storage.loadScene(project.id)) }
              var showAxis by remember { mutableStateOf(true) }

              Box(modifier = Modifier.fillMaxSize()) {
                  AndroidView(
                      modifier = Modifier.fillMaxSize(),
                      factory = { ctx ->
                          LineViewportView(ctx, project.theme, scene)
                      },
                      update = { view ->
                          view.updateScene(scene)
                          view.setShowOriginAxis(showAxis)
                      }
                  )

                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .background(Color(0xAA0D1117))
                          .padding(horizontal = 12.dp, vertical = 8.dp)
                          .align(Alignment.TopCenter),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          OutlinedButton(onClick = {
                              storage.saveScene(project.id, scene)
                              onBackToHub()
                          }) {
                              Text("Hub")
                          }
                          Column {
                              Text(project.name, color = Color.White, fontWeight = FontWeight.Bold, fontSize = 15.sp)
                              Text(
                                  if (scene.entities.isEmpty()) "Empty Preview • 1-finger Orbit • 2-finger Pan/Zoom"
                                  else "${scene.entities.size} Shapes",
                                  color = Color(0xFF8B949E),
                                  fontSize = 11.sp
                              )
                          }
                      }

                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          OutlinedButton(onClick = { showAxis = !showAxis }) {
                              Text(if (showAxis) "Axis: ON" else "Axis: OFF")
                          }
                          Button(onClick = { storage.saveScene(project.id, scene) }) {
                              Text("Save")
                          }
                      }
                  }
              }
          }
          EOF

      - name: Commit project files to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Setup LineEngine3D starter project" || echo "No changes"
          git push

      - name: Zip source code (optional download)
        run: zip -r LineEngine3D-source.zip settings.gradle.kts build.gradle.kts gradle.properties app/

      - name: Upload Source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: line-engine-source-zip
          path: LineEngine3D-source.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: line-engine-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
